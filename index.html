<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" class="stylesheet">
    <title>Figma - My Portifolio</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="navbaritems">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Case Studies</a></li>
                    <li><a href="#">Testimonials</a></li>
                    <li><a href="#">Recent Works</a></li>
                    <li><a href="#">Get In Touch</a></li>
                </ul>
            </div>

            <div class="socials">
                <img src="./images/LinkedIn.svg" alt="Linkedin" class="linkedin">
                <img src="./images/Behance.svg" alt="Behance" class="behance">
                <img src="./images/Twitter.svg" alt="Twitter" class="twitter">
            </div>
        </nav>
    </header>

    <section class="middle-content">
        <div class="content">
            <div class="content-text">
                <h2>Amanda Zavadzki Thomaz (aka Zava)</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Officiis, impedit!</p>
                <div class="button">
                <a href="#">Let's get started <img src="./images/arrow.svg" alt="Arrow pointing right"></a>
                </div>
            
            </div>

            <div class="content-img">
                <img src="./images/myphoto.jpg" alt="My photo">
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-text">
            <h2>Worked with</h2>
        </div>

        <div class="footer-boxes">
            <div class="box">
                <img src="./images/clickup.svg" alt="Click Up">
            </div>

            <div class="box">
                <img src="./images/dropbox.svg" alt="Dropbox">
            </div>

            <div class="box">
                <img src="./images/paychex.svg" alt="Paychex">
            </div>

            <div class="box">
                <img src="./images/elastic.svg" alt="Elastic">
            </div>

            <div class="box">
                <img src="./images/stripe.svg" alt="Stripe">
            </div>
        </div>
    </footer>

</body>

</html>
